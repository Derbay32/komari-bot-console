name: 构建并发布 Docker 镜像

on:
  release:
    types: [created]
  push:
    tags:
      - "v*-beta*"
      - "v*-rc*"

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 准备镜像与版本变量
        id: prepare
        shell: bash
        run: |
          RAW_TAG="${{ github.event.release.tag_name || github.ref_name }}"
          NORMALIZED_TAG="${RAW_TAG#v}"
          LOWER_OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          echo "raw_tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "normalized_tag=${NORMALIZED_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_repo=ghcr.io/${LOWER_OWNER}/komari-bot-console" >> "$GITHUB_OUTPUT"

      - name: 创建预发布 Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "预发布 Release 已存在，跳过创建"
          else
            gh release create "${{ github.ref_name }}" \
              --prerelease \
              --title "预发布版本 ${{ github.ref_name }}" \
              --notes "自动化构建的预发布版本"
          fi

      - name: 打包并上传部署文件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export TAG_NAME="${{ steps.prepare.outputs.raw_tag }}"
          export IMAGE_NAME="${{ steps.prepare.outputs.image_repo }}:${{ steps.prepare.outputs.normalized_tag }}"

          mkdir -p komari-bot-console-deploy
          cp docker-compose.yaml komari-bot-console-deploy/docker-compose.yaml
          cp .env.example komari-bot-console-deploy/.env.example

          python - <<'PY'
          import os
          from pathlib import Path

          compose_path = Path("komari-bot-console-deploy/docker-compose.yaml")
          content = compose_path.read_text()
          content = content.replace(
              "image: komari-bot-console:latest",
              f"image: {os.environ['IMAGE_NAME']}",
          )
          compose_path.write_text(content)
          PY

          tar -czf "komari-bot-console-${TAG_NAME}.tar.gz" -C komari-bot-console-deploy docker-compose.yaml .env.example
          gh release upload "${TAG_NAME}" "komari-bot-console-${TAG_NAME}.tar.gz" --clobber

      - name: 判断是否为正式发布
        id: release_type
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成镜像标签
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.prepare.outputs.image_repo }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=${{ steps.release_type.outputs.is_release == 'true' }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
